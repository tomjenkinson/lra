# MicroProfile Configuration for LRA Coordinator Benchmarks
#
# This file contains configuration for the Bulkhead and other fault tolerance
# mechanisms in the LRA coordinator.
#
# Note: These settings apply when the coordinator is running with MicroProfile
# Fault Tolerance support. The actual configuration should be set on the
# coordinator deployment, not in the benchmark client.

# Bulkhead Configuration for Coordinator.startLRA
# The default value is 10 concurrent requests.
# Increase this to handle higher concurrency in production environments.
#
# Example configurations:
# io.narayana.lra.coordinator.api.Coordinator/startLRA/Bulkhead/value=10
# io.narayana.lra.coordinator.api.Coordinator/startLRA/Bulkhead/waitingTaskQueue=50

# For testing purposes, you can configure different Bulkhead values:
# Low concurrency:  value=5
# Medium concurrency: value=20
# High concurrency: value=50
# Very high concurrency: value=100

# Example to set Bulkhead to 64 (as mentioned in the original issue):
# io.narayana.lra.coordinator.api.Coordinator/startLRA/Bulkhead/value=64
# io.narayana.lra.coordinator.api.Coordinator/startLRA/Bulkhead/waitingTaskQueue=200

# Timeout Configuration
# org.eclipse.microprofile.faulttolerance.Timeout.enabled=true
# io.narayana.lra.coordinator.api.Coordinator/startLRA/Timeout/value=30000

# Circuit Breaker (if needed for testing resilience)
# io.narayana.lra.coordinator.api.Coordinator/startLRA/CircuitBreaker/enabled=false

# Benchmark-specific settings
benchmark.coordinator.url=http://localhost:8080/lra-coordinator
benchmark.warmup.iterations=3
benchmark.measurement.iterations=5
